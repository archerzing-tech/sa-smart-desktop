<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA SMART DESKTOP · Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-alt:#edf0f5;
  --border:#e2e5ea;--border-light:#eef1f5;
  --text:#1a1a2e;--text-secondary:#5d5d7a;--text-muted:#9090aa;
  --accent:#4f46e5;--accent-light:#818cf8;--accent-bg:#edf0ff;
  --green:#10b981;--green-bg:#ecfdf7;
  --amber:#f59e0b;--amber-bg:#fff8eb;
  --pink:#ec4899;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro','Microsoft YaHei',system-ui,sans-serif;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
}
html{font-size:15px}
@media(max-width:600px){html{font-size:14px}}
@media(max-width:420px){html{font-size:13px}}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 24px;transition:all .6s
}
.welcome.shrink{min-height:0;padding:0;position:sticky;top:0;z-index:20}
.welcome-inner{text-align:center;max-width:640px;width:100%;transition:all .6s}
.welcome.shrink .welcome-inner{display:none}
@media(max-width:600px){.welcome{padding:24px 16px}.welcome h1{font-size:26px}}
@media(max-width:420px){.welcome h1{font-size:22px}.welcome p{font-size:13px}}
.welcome h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-bottom:4px;background:linear-gradient(135deg,#1a1a2e,#4f46e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{font-size:14px;color:var(--text-muted);margin-bottom:24px;line-height:1.5}
.input-box{
  background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:6px;display:flex;align-items:center;gap:10px;width:100%;
  box-shadow:var(--shadow);transition:all .3s
}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
@media(max-width:480px){.input-box textarea{padding:14px 16px;font-size:14px}}
.input-box textarea{
  flex:1;border:none;outline:none;background:transparent;padding:18px 20px;
  font-size:15px;font-family:var(--font);color:var(--text);resize:none;
  min-height:28px;max-height:130px;line-height:1.55;overflow-y:auto
}
.input-box textarea::placeholder{color:var(--text-muted)}
.input-box button{
  width:48px;height:48px;border:none;border-radius:14px;flex-shrink:0;margin-right:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:#fff;font-size:21px;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;justify-content:center
}
.input-box button:hover{transform:scale(1.05);box-shadow:0 0 28px rgba(79,70,229,.35)}
.input-box button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 16px;background:var(--surface);border:1px solid var(--border);border-radius:100px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.chip:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* Welcome footer — model & version */
.welcome-footer{
  margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap
}
.wf-item{
  display:flex;align-items:center;gap:6px;padding:5px 14px;
  background:var(--surface);border:1px solid var(--border-light);border-radius:100px;
  font-size:12px;font-family:var(--mono);color:var(--text-secondary)
}
.wf-item .wf-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.wf-item .wf-dot.green{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,.4)}
.wf-item .wf-dot.purple{background:var(--accent);box-shadow:0 0 6px rgba(79,70,229,.3)}
.wf-item .wf-label{font-weight:500}
.wf-item .wf-val{color:var(--text-muted)}

@media(max-width:600px){.workspace{padding:0 12px}}
.workspace{display:none;flex-direction:column;height:100vh;max-width:860px;margin:0 auto;padding:0 24px}
.workspace.show{display:flex}
.ws-top{
  display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;flex-shrink:0
}
.ws-brand{display:flex;align-items:center;gap:8px}
.ws-brand .m{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.ws-brand .t{font-size:13px;font-weight:700;letter-spacing:.3px}
@media(max-width:600px){.ws-brand .st{display:none}}
.ws-brand .st{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-left:4px}
.ws-status{font-size:11px;font-family:var(--mono);color:var(--text-muted);display:flex;align-items:center;gap:8px}
.ws-status .d{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

.ws-body{flex:1;overflow-y:auto;padding:4px 0 60px;min-height:0;scroll-behavior:smooth}
.ws-body::-webkit-scrollbar{width:4px}
.ws-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{animation:msg-in .5s cubic-bezier(.22,1,.36,1)}
@keyframes msg-in{from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)}}
.msg.user{
  float:right;clear:both;max-width:75%;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;
  padding:10px 16px;border-radius:18px 18px 4px 18px;font-size:14px;line-height:1.55;
  box-shadow:0 2px 12px rgba(79,70,229,.12);margin-bottom:10px
}
@media(max-width:480px){.msg.user{max-width:85%;padding:8px 12px;font-size:13px}}
.msg.agent{clear:both;margin-bottom:10px}
.msg-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding-left:2px;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
.msg-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* Phase card */
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:pc-in .55s cubic-bezier(.22,1,.36,1)}
@keyframes pc-in{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:480px){.p-hd{padding:10px 12px;gap:6px}.p-hd .pt{font-size:12px}}
.p-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border-light);user-select:none}
.p-hd .pi{font-size:16px}
.p-hd .pt{font-size:13px;font-weight:600;flex:1}
.p-hd .ps{
  font-size:10px;font-family:var(--mono);padding:2px 10px;border-radius:100px;
  background:var(--accent-bg);color:var(--accent);transition:all .3s
}
.p-hd .ps.done{background:var(--green-bg);color:var(--green)}
.p-hd .ps.active{animation:ps-active 1.2s ease-in-out infinite}
@keyframes ps-active{
  0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.35)}
  50%{box-shadow:0 0 0 6px rgba(79,70,229,0)}
}
@media(max-width:480px){.p-hd .skill-badge{display:none}}
.p-hd .skill-badge{font-size:9px;padding:1px 8px;border-radius:100px;background:#f3e8ff;color:#7c3aed;font-family:var(--mono);font-weight:600;letter-spacing:.2px;margin-right:4px;white-space:nowrap}
.p-hd .pe{font-size:9px;color:var(--text-muted);transition:transform .3s}
.p-hd .pe.open{transform:rotate(180deg)}
.p-body{max-height:0;overflow:hidden;transition:max-height .45s,opacity .25s;opacity:0;will-change:max-height}
.p-body.open{max-height:4000px;opacity:1}

/* Events inside phase */
.events{padding:10px 16px 6px;display:flex;flex-direction:column;gap:3px}
@media(max-width:480px){.events{padding:6px 10px 4px}}
.ev{
  display:flex;gap:10px;padding:6px 10px 6px 12px;border-radius:var(--radius-sm);
  position:relative;overflow:hidden;
  animation:ev-in .5s cubic-bezier(.22,1,.36,1), ev-glow 1.2s ease-out .25s
}
.ev::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;width:2.5px;
  background:var(--accent);border-radius:2px;
  animation:ev-line .45s cubic-bezier(.22,1,.36,1), ev-line-pulse .7s ease-in-out .35s 3
}
.ev::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent 0%,rgba(79,70,229,.06) 50%,transparent 100%);
  background-size:200% 100%;pointer-events:none;border-radius:var(--radius-sm);
  animation:ev-shimmer .6s ease-out .1s
}
@keyframes ev-in{
  0%{opacity:0;transform:translateY(14px);background:var(--accent-bg)}
  45%{background:var(--accent-bg)}
  100%{opacity:1;transform:translateY(0);background:transparent}
}
@keyframes ev-glow{
  0%{box-shadow:0 0 10px rgba(79,70,229,.2)}
  100%{box-shadow:none}
}
@keyframes ev-line{
  from{height:0;opacity:0} to{height:calc(100% - 12px);opacity:1}
}
@keyframes ev-line-pulse{
  0%,100%{opacity:.5;width:2.5px}
  50%{opacity:1;width:3.5px;box-shadow:0 0 8px var(--accent)}
}
@keyframes ev-shimmer{
  0%{background-position:200% 0;opacity:1}
  100%{background-position:-200% 0;opacity:0}
}
.ev-icon{
  flex-shrink:0;width:20px;text-align:center;font-size:14px;margin-top:1px;
  animation:ev-icon .5s cubic-bezier(.34,1.56,.64,1)
}
@keyframes ev-icon{
  0%{transform:scale(0) rotate(-15deg);opacity:0}
  55%{transform:scale(1.35) rotate(5deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.ev-body{flex:1;min-width:0}
.ev-t{font-size:13px;line-height:1.55}
.ev-t .hl{color:var(--accent);font-weight:500}
.ev-t .dim{color:var(--text-muted)}
.ev-t .warn{color:var(--amber)}
.ev-t .err{color:#dc2626}
.ev-t .ok{color:var(--green)}
.ev-sub{
  font-size:11.5px;color:var(--text-secondary);margin-top:2px;line-height:1.5;
  padding:4px 0 2px;opacity:0;transition:opacity .35s
}
.ev-sub .tag{
  display:inline-block;font-size:10px;padding:1px 7px;border-radius:100px;
  background:var(--surface-alt);color:var(--text-muted);font-family:var(--mono);margin-right:4px
}
.ev-sub .tag.warn{background:var(--amber-bg);color:#d97706}
.ev-sub .tag.ok{background:var(--green-bg);color:var(--green)}
.ev-sub{animation:es-in .35s cubic-bezier(.22,1,.36,1)}
@keyframes es-in{from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:translateY(0)}}
.ev-body{min-height:1.5em}

.ev-content{margin:8px 0 4px 28px;border-radius:var(--radius-sm);overflow:hidden;animation:ec-in .4s cubic-bezier(.22,1,.36,1)}
@keyframes ec-in{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)}}
.ec-diagram{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre;overflow-x:auto;color:var(--text)}
.ec-code{background:#1a1a2e;color:#e2e8f0;border-radius:var(--radius-sm);padding:12px 16px;font-size:12px;line-height:1.6;overflow-x:auto}
.ec-code pre{margin:0;white-space:pre;tab-size:2}
.ec-code code{font-family:var(--mono)}
.ec-code .kw{color:#c084fc}.ec-code .str{color:#86efac}.ec-code .cm{color:#64748b}.ec-code .fn{color:#60a5fa}.ec-code .tp{color:#fbbf24}
.ec-summary{background:var(--accent-bg);border:1px solid rgba(79,70,229,.15);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;line-height:1.7;color:var(--text)}
.ec-summary .ec-title{font-weight:600;font-size:11.5px;color:var(--accent);margin-bottom:4px;font-family:var(--mono);letter-spacing:.3px}
.ec-flow{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-family:var(--mono);font-size:11px;line-height:1.7;white-space:pre;color:var(--text)}

.ia-box{margin:10px 0 4px 28px;animation:ia-in .35s cubic-bezier(.22,1,.36,1)}
@keyframes ia-in{from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)}}
.ia-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 20px;
  border-radius:var(--radius-sm);border:1.5px solid var(--accent);
  background:var(--surface);color:var(--accent);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;font-family:var(--font)
}
.ia-btn:hover{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.2)}
.ia-btn:active{transform:scale(.97)}
.ia-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;background:var(--surface);color:var(--text-muted);border-color:var(--border)}
.ia-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ia-opt{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:all .2s;user-select:none
}
.ia-opt:hover{border-color:var(--accent)}
.ia-opt .ia-dot{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--text-muted);
  flex-shrink:0;transition:all .25s;display:flex;align-items:center;justify-content:center
}
.ia-opt:hover .ia-dot{border-color:var(--accent)}
.ia-opt .ia-body{flex:1;min-width:0}
.ia-opt .ia-l{font-size:13px;font-weight:600;color:var(--text)}
.ia-opt .ia-d{font-size:11.5px;color:var(--text-secondary);margin-top:1px}
.ia-opt.selected{border-color:var(--accent);background:var(--accent-bg)}
.ia-opt.selected .ia-dot{border-color:var(--accent);background:var(--accent)}
.ia-opt.selected .ia-dot::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.ia-opt.disabled{opacity:.5;pointer-events:none}

/* Assets */
.assets{
  padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px;
  max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s,padding .4s;
  border-top:1px solid transparent
}
.assets.show{max-height:600px;opacity:1;padding:10px 16px 14px;border-top-color:var(--border-light)}
.assets-title{font-size:11px;font-weight:600;color:var(--text-muted);font-family:var(--mono);letter-spacing:.5px;margin-bottom:2px}
.assets-list{display:flex;flex-wrap:wrap;gap:10px}
.asset{
  display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-alt);
  border-radius:var(--radius);border:1px solid var(--border);font-size:14px;
  cursor:pointer;transition:all .2s;min-width:180px
}
@media(max-width:480px){.asset{min-width:calc(50% - 5px);padding:10px 12px;gap:8px}}
.asset .ai{font-size:24px}
.asset .an{font-weight:600;font-size:13px}
.asset .as{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.asset:hover{background:var(--accent-bg);border-color:var(--accent)}
.asset .ai{font-size:15px}
.asset .an{font-weight:500}
.asset .as{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-left:2px}
.asset .dl{font-size:15px;color:var(--accent);font-family:var(--mono);margin-left:auto;opacity:0;transition:opacity .2s}
.asset:hover .dl{opacity:1}
.asset .ext{
  font-size:10px;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-weight:600;
  text-transform:uppercase
}
.asset .ext.pdf{background:#fee2e2;color:#dc2626}
.asset .ext.docx{background:#dbeafe;color:#2563eb}
.asset .ext.xlsx{background:#dcfce7;color:#16a34a}
.asset .ext.zip{background:#fef3c7;color:#d97706}
.asset .ext.html{background:#f3e8ff;color:#7c3aed}
.asset .ext.png{background:#fce7f3;color:#db2777}

.fa{text-align:center;padding:10px 0 6px;color:var(--text-muted);font-size:10px;font-family:var(--mono);letter-spacing:2px;clear:both;animation:fa-in .4s cubic-bezier(.22,1,.36,1)}
@keyframes fa-in{from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)}}



/* Phase status transition */
.ps{transition:all .45s cubic-bezier(.22,1,.36,1)!important}
.ps.done{animation:ps-done .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes ps-done{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

/* Asset panel entrance */
.assets.show{animation:as-in .5s cubic-bezier(.22,1,.36,1)}
@keyframes as-in{from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)}}

/* File generation spinner */
.gen-spinner{
  display:flex;align-items:center;gap:10px;padding:6px 0 4px;animation:gs-in .3s ease-out
}
@keyframes gs-in{from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)}}
.gs-ring{
  width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:gs-spin .7s linear infinite
}
@keyframes gs-spin{to{transform:rotate(360deg)}}
.gs-text{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.gs-done{animation:gs-out .35s ease-out forwards}
@keyframes gs-out{to{opacity:0;transform:translateY(-4px);max-height:0;padding:0;margin:0;overflow:hidden}}

.refs{margin-bottom:10px;animation:rf-in .4s ease-out}
@keyframes rf-in{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)}}
.refs-title{font-size:11px;font-weight:600;color:var(--text-muted);font-family:var(--mono);letter-spacing:.5px;margin-bottom:4px}
.refs-list{display:flex;flex-wrap:wrap;gap:4px}
.ref-item{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--surface-alt);border-radius:6px;border:1px solid var(--border-light);font-size:11.5px;color:var(--text-secondary)}

.typing-el{max-width:860px;margin:0 auto;padding:0 24px}
.typing-el.hidden{visibility:hidden;height:0;overflow:hidden;padding:0;margin:0}
.typing-r{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  animation:ti-in .25s ease-out
}
@keyframes ti-in{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)}}
.typing-a{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;font-weight:700;letter-spacing:0;position:relative;
  animation:ta-pulse 2s ease-in-out infinite
}
.typing-a::after{
  content:'';position:absolute;width:32px;height:32px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;
  animation:bw-wave 2.4s ease-out infinite
}
@keyframes ta-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.35)}
  50%{box-shadow:0 0 0 8px rgba(79,70,229,0)}
}
@keyframes bw-wave{
  0%{transform:scale(.7);opacity:.6}
  100%{transform:scale(1.6);opacity:0}
}
.typing-a.think::after{animation:bw-wave 1.8s ease-out infinite}
.typing-a.think{animation:ta-pulse 1.2s ease-in-out infinite}
.typing-l{font-size:11px;font-family:var(--mono);color:var(--text-muted);display:flex;align-items:center;gap:8px}
.typing-d{display:inline-flex;gap:4px}
.typing-d span{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  animation:td 1.5s infinite both
}
.typing-d span:nth-child(1){animation-delay:0s}
.typing-d span:nth-child(2){animation-delay:.2s}
.typing-d span:nth-child(3){animation-delay:.4s}
.typing-d span:nth-child(4){animation-delay:.6s}
@keyframes td{
  0%,80%,100%{transform:scale(.55);opacity:.3}
  40%{transform:scale(1);opacity:1}
}
.typing-label{
  display:inline-block;font-size:10px;color:var(--text-muted);
  background:var(--surface-alt);padding:1px 8px;border-radius:4px;
  font-family:var(--mono);letter-spacing:.3px;animation:tl-in .3s ease-out
}
@keyframes tl-in{from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)}}

/* MCP write simulation */

/* Tool-call notification panel (slides in from right like email) */

/* Category badge */

</style>

<body>

</div>

<!-- Workspace -->

    </div>

    </div>

</div>

    <div class="typing-a">⚡</div>
    <div class="typing-l">
      <span id="typingLabel">分析中</span>
      <div class="typing-d"><span></span><span></span><span></span><span></span></div>
    </div>
    <span class="typing-label" id="typingStep"></span>
  </div>
</div>

<script>
/* ==================================================================
   SA SMART DESKTOP — Realistic Agent Engine
   ================================================================== */

const $ = id => document.getElementById(id);
window.$ = $;
const dom = {
  welcome: $('welcome'), input: $('input'), sendBtn: $('sendBtn'), chips: $('chips'),
  ws: $('workspace'), wsBody: $('wsBody'), wsStatus: $('wsStatus'),
  input2: $('input2'), sendBtn2: $('sendBtn2'), wsBottom: $('wsBottom'),
  typing: $('typingEl'), toast: $('toast'),
};

const S = { running:false, timer:null, start:0, phaseTotal:0, phases:[], type:'', skill:'', conversation:null, currentPhaseIdx:0, notifBusy:false };

const sleep = ms => new Promise(r => setTimeout(r, ms));
const ts = () => new Date().toTimeString().slice(0, 8);

function rand(min, max) { return Math.random() * (max - min) + min; }

function sb() { requestAnimationFrame(() => { try { dom.wsBody.scrollTo({ top: dom.wsBody.scrollHeight, behavior: 'smooth' }); }catch(e){} }); }

function sbToPhase(idx) {
  requestAnimationFrame(() => {
    try {
      const el = $('pst-' + idx);
      if (el) {
        const parent = dom.wsBody;
        const top = Math.max(0, el.offsetTop - 12);
        parent.scrollTo({ top, behavior: 'smooth' });
      }
    } catch(e) {}
  });
}

function showTyp(on, label, step) {
  dom.typing.classList.toggle('hidden', !on);
  if(on && label) {
    const lb=$('typingLabel'); if(lb) lb.textContent = label;
    const st=$('typingStep');
    if(st) {
      if(step) { st.textContent = '步骤 ' + step; st.style.display = 'inline-block'; }
      else { st.style.display = 'none'; }
    }
  }
}
function setV(v) { dom.input.value=v; dom.input.focus(); }

let toastTimer = null;
function toast(msg) {
  dom.toast.textContent=msg; dom.toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>dom.toast.classList.remove('show'), 2000);
}

// ===== Notification system: agent actions & tool calls =====
const NOTIF_ACTIONS = {
  think:[
    { label:'Agent.think', cat:'推理' }, { label:'Mind.map', cat:'思维' }
  ],
  search:[
    { label:'Knowledge.search', cat:'工具' }, { label:'Doc.lookup', cat:'文档' }
  ],
  found:[
    { label:'Knowledge.match', cat:'工具' }, { label:'Doc.capture', cat:'文档' }
  ],
  retry:[
    { label:'Agent.retry', cat:'工具' }, { label:'Source.switch', cat:'系统' }
  ],
  fail:[
    { label:'System.warn', cat:'系统' }
  ],
  decide:[
    { label:'Agent.decide', cat:'推理' }, { label:'Report.summarize', cat:'汇总' }
  ],
  done:[
    { label:'Write.output', cat:'编码' }, { label:'Doc.archive', cat:'文档' },
    { label:'Report.compile', cat:'汇总' }
  ],
  wait:[
    { label:'System.wait', cat:'系统' }
  ],
  write:[
    { label:'MCP.write', cat:'编码' }, { label:'File.generate', cat:'工具' }
  ],
  info:[
    { label:'Doc.organize', cat:'文档' }, { label:'Sort.structure', cat:'整理' }
  ],
  ref:[
    { label:'Knowledge.reference', cat:'工具' }, { label:'Doc.cite', cat:'文档' }
  ],
  skip:[
    { label:'Agent.skip', cat:'工具' }
  ],
};
const NOTIF_ICONS = {
  think:'💭', search:'🔍', found:'📌', retry:'🔄', fail:'⚠️',
  decide:'🤔', done:'✅', wait:'⏳', info:'ℹ️', ref:'📎', skip:'⏭️', skill:'🎯', write:'✍️'
};
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// Category → CSS class mapping for border colors
const CAT_CLASS = { '工具':'tool', '技能':'skill', '文档':'doc', '编码':'code', '汇总':'report', '系统':'system', '推理':'think', '思维':'think', '整理':'doc' };
const BADGE_CLASS = { '工具':'tool', '技能':'skill', '文档':'doc', '编码':'code', '汇总':'report', '系统':'system' };

function closeNotif(el) {
  if(!el || !el.parentNode) return;
  if(el._autoTimer) clearTimeout(el._autoTimer);
  el.classList.add('out');
  setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 300);
}

function notify(icon, text) {
  if(S.notifBusy) return null;
  const stack = $('notifStack');
  if(!stack) return null;

  const action = pick(NOTIF_ACTIONS[icon]||[{label:'Agent.run', cat:'工具'}]);
  const time = new Date().toTimeString().slice(0,8);
  const catClass = CAT_CLASS[action.cat]||'tool';
  const showBadge = Math.random() > 0.4;

  const clampClass = Math.random() < 0.4 ? 'clamp1' : (Math.random() < 0.54 ? 'clamp2' : 'full');

  const el = document.createElement('div');
  el.className = 'notif cat-'+catClass;
  el.innerHTML = `<div class="notif-close" onclick="dismissNotif(this)">✕</div>
    <div class="notif-icon">${NOTIF_ICONS[icon]||'⚡'}</div>
    <div class="notif-body">
      <div class="notif-header"><span class="notif-tool">${action.label}()</span><span class="notif-time">${time}</span></div>
      <div class="notif-text ${clampClass}">${text}</div>
      ${showBadge ? `<div class="notif-badge ${BADGE_CLASS[action.cat]||'tool'}">${action.cat}</div>` : ''}
    </div>`;
  stack.appendChild(el);

  // Default auto-dismiss after 5s (overridden by closeNotif for event-bound notifications)
  const timer = setTimeout(() => {
    if(el.parentNode) { el.classList.add('out'); setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 300); }
  }, 5000);
  el._autoTimer = timer;

  // Cap at 6 visible — remove oldest immediately
  while(stack.children.length > 6) {
    const first = stack.children[0];
    if(first && first.parentNode) first.parentNode.removeChild(first);
  }
  return el;
}

function dismissNotif(btn) {
  const el = btn.closest('.notif');
  if(!el) return;
  if(el._autoTimer) clearTimeout(el._autoTimer);
  el.classList.add('out');
  setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 300);
}

function startTimer() {
  S.start=Date.now(); S.timer=setInterval(()=>{
    const e=Date.now()-S.start;
    const el=$('timer'); if(el) el.textContent=String(Math.floor(e/60000)).padStart(2,'0')+':'+String(Math.floor(e%60000/1000)).padStart(2,'0');
  },1000);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}

function addMsg(type, html) {
  const m=document.createElement('div'); m.className='msg '+type;
  if(type==='user') m.textContent=html; else m.innerHTML=html;
  dom.wsBody.appendChild(m); sb();
}

// ===== Event builders (realistic, no buzzwords) =====
function evIcon(type) {
  const m = { think:'💭', search:'🔍', found:'📌', retry:'🔄', fail:'⚠️', done:'✅', decide:'🤔', wait:'⏳', info:'ℹ️', ref:'📎', skip:'⏭️', skill:'🎯' };
  return m[type] || '•';
}

function evHTML(icon, text, sub) {
  return `<div class="ev"><div class="ev-icon">${icon}</div><div class="ev-body"><div class="ev-t">${text}</div>${sub ? `<div class="ev-sub">${sub}</div>` : ''}</div></div>`;
}

function renderContent(type, data, title) {
  const d=document.createElement('div'); d.className='ev-content';
  const cls='ec-'+type; let html='';
  if(title) html+=`<div class="ec-title" style="font-weight:600;font-size:11px;color:var(--accent);margin-bottom:4px;font-family:var(--mono);letter-spacing:.3px">${title}</div>`;
  if(type==='code') {
    html+=`<div class="${cls}"><pre><code>${data.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre></div>`;
  } else {
    html+=`<div class="${cls}">${data}</div>`;
  }
  d.innerHTML=html; return d;
}

// ===== MCP write simulation =====
const THINK_STAGES = {
  think:['理解上下文...','关联知识库...','推理中...','综合判断...','得出结论...'],
  search:['构建查询...','检索索引...','匹配结果...','排序相关度...'],
  decide:['评估选项...','权衡利弊...','决策中...'],
};

async function mcpWrite(icon, filename, ext) {
  S.notifBusy = true;
  const stack = $('notifStack');
  if(stack) {
    try {
      const action = { label:'MCP.write', cat:'编码' };
      const time = new Date().toTimeString().slice(0,8);
      const el = document.createElement('div'); el.className='notif cat-code';
      el.innerHTML = `<div class="notif-close" onclick="dismissNotif(this)">✕</div>
        <div class="notif-icon">✍️</div>
        <div class="notif-body">
          <div class="notif-header"><span class="notif-tool">MCP.write()</span><span class="notif-time">${time}</span></div>
          <div class="notif-text">${filename}.${ext}</div>
          <div class="notif-badge tool">写入</div>
        </div>`;
      stack.appendChild(el);
      const total = rand(2000,4000), steps = 20;
      for(let s=1; s<=steps; s++) {
        await sleep(total/steps);
        const pct = Math.round(s/steps*100);
        el.querySelector('.notif-text').textContent = `${filename}.${ext}  ${pct}%`;
      }
      el.querySelector('.notif-text').textContent = `✓ ${filename}.${ext}`;
      el.style.borderLeftColor = 'var(--green)';
      setTimeout(() => { if(el.parentNode) { el.classList.add('out'); setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el)},300); } }, 2000);
      while(stack.children.length > 6) { const f=stack.children[0]; if(f&&f.parentNode)f.parentNode.removeChild(f); }
    }catch(e){}
  }
  // Inline progress bar inside phase assets
  const container = document.querySelector(`#al-${S.currentPhaseIdx}`);
  if(!container) return;
  const row=document.createElement('div'); row.className='mcp-w';
  row.innerHTML=`<span class="mcp-icon">${icon||'📄'}</span><span class="mcp-file"><span class="fn">${filename}.${ext}</span></span><span class="mcp-bar"><span class="mcp-fill"></span></span><span class="mcp-status">0%</span>`;
  container.appendChild(row);
  sb();
  const total=rand(2500,4500), steps=20;
  for(let s=1; s<=steps; s++) {
    await sleep(total/steps);
    const pct=Math.round(s/steps*100);
    row.querySelector('.mcp-fill').style.width=pct+'%';
    row.querySelector('.mcp-status').textContent=pct+'%';
  }
  row.classList.add('done');
  row.querySelector('.mcp-status').textContent='✓';
  S.notifBusy = false;
  sb();
}

// ===== MCP tool call (generic) =====
async function mcpCall(container, tool, args, label) {
  S.notifBusy = true;
  const stack = $('notifStack');
  if(stack) {
    try {
      const time = new Date().toTimeString().slice(0,8);
      const el = document.createElement('div'); el.className='notif cat-code';
      el.innerHTML = `<div class="notif-close" onclick="dismissNotif(this)">✕</div>
        <div class="notif-icon">🔧</div>
        <div class="notif-body">
          <div class="notif-header"><span class="notif-tool">${tool}()</span><span class="notif-time">${time}</span></div>
          <div class="notif-text">${args || label || ''}</div>
          <div class="notif-badge tool">执行</div>
        </div>`;
      stack.appendChild(el);
      const total = rand(2000,4500), steps = 15;
      for(let s=1; s<=steps; s++) {
        await sleep(total/steps);
        const pct = Math.round(s/steps*100);
        if(el.querySelector('.notif-text')) el.querySelector('.notif-text').textContent = `${label || tool}  ${pct}%`;
      }
      if(el.querySelector('.notif-text')) el.querySelector('.notif-text').textContent = `✓ ${label || tool}`;
      el.style.borderLeftColor = 'var(--green)';
      setTimeout(() => { if(el.parentNode) { el.classList.add('out'); setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el)},300); } }, 2000);
      while(stack.children.length > 6) { const f=stack.children[0]; if(f&&f.parentNode)f.parentNode.removeChild(f); }
    }catch(e){}
  }
  // Inline row
  const row=document.createElement('div'); row.className='mcp-w';
  row.innerHTML=`<span class="mcp-icon">🔧</span><span class="mcp-file"><span class="fn">${label || tool}</span>${args ? `<span style="color:var(--text-muted);font-size:10px;margin-left:6px">${args}</span>` : ''}</span><span class="mcp-bar"><span class="mcp-fill"></span></span><span class="mcp-status">0%</span>`;
  container.appendChild(row);
  sb();
  const total=rand(3000,5500), steps=20;
  for(let s=1; s<=steps; s++) {
    await sleep(total/steps);
    const pct=Math.round(s/steps*100);
    row.querySelector('.mcp-fill').style.width=pct+'%';
    row.querySelector('.mcp-status').textContent=pct+'%';
  }
  row.classList.add('done');
  row.querySelector('.mcp-status').textContent='✓';
  S.notifBusy = false;
  sb();
}

// ===== Render assets =====
function renderAssets(idx, assets) {
  const list=$('al-'+idx);
  if(!list || !assets) return;
  assets.forEach(a => {
    const el=document.createElement('div'); el.className='asset';
    el.innerHTML=`<span class="ai">${a.icon}</span><span class="an">${a.n}.${a.ext}</span><span class="as">${a.size}</span><span class="ext ${a.ext}">${a.ext}</span><span class="dl">⬇</span>`;
    el.onclick=()=>{
      const c=`SA SMART DESKTOP — ${a.n}.${a.ext}\nGenerated: ${new Date().toISOString()}\n\nThis is a simulated asset from SA agent system.`;
      const b=new Blob([c],{type:'text/plain'}), u=URL.createObjectURL(b);
      const l=document.createElement('a'); l.href=u; l.download=`${a.n}.${a.ext}`;
      document.body.appendChild(l); l.click(); document.body.removeChild(l); URL.revokeObjectURL(u);
      toast(`⬇ ${a.n}.${a.ext} 已下载`);
    };
    list.appendChild(el);
  });
}

// ===== Interaction helpers =====
function waitConfirm(container, label) {
  return new Promise(r => {
    const box = document.createElement('div'); box.className = 'ia-box';
    const btn = document.createElement('button'); btn.className = 'ia-btn';
    btn.textContent = label || '确认继续';
    box.appendChild(btn); container.appendChild(box); sb();
    setTimeout(() => { btn.disabled = true; r(); }, 2000);
  });
}

function waitDecision(container, question, options) {
  return new Promise(r => {
    const box = document.createElement('div'); box.className = 'ia-box';
    box.innerHTML = `<div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px">${question}</div><div class="ia-list"></div>`;
    const list = box.querySelector('.ia-list');
    const picked = Math.floor(Math.random() * options.length);
    options.forEach((opt, i) => {
      const el = document.createElement('div'); el.className = 'ia-opt';
      el.innerHTML = `<div class="ia-dot"></div><div class="ia-body"><div class="ia-l">${opt.label}</div>${opt.desc ? `<div class="ia-d">${opt.desc}</div>` : ''}</div>`;
      el.onclick = () => {
        list.querySelectorAll('.ia-opt').forEach(o => o.classList.add('disabled'));
        el.classList.add('selected');
        setTimeout(() => r(opt.value || opt.label), 350);
      };
      list.appendChild(el);
    });
    container.appendChild(box); sb();
    setTimeout(() => {
      const els = list.querySelectorAll('.ia-opt');
      els.forEach(o => o.classList.add('disabled'));
      els[picked].classList.add('selected');
      setTimeout(() => r(options[picked].value || options[picked].label), 350);
    }, 2000);
  });
}

async function execPhase(idx) {
  try {
    const phase = S.phases ? S.phases[idx] : null;
    if(!phase) { toast('⚠️ execPhase: phase '+idx+' not found'); return; }

    const container = $('evts-'+idx);
    if(!container) { toast('⚠️ execPhase: container evts-'+idx+' not found'); return; }

    const events = typeof phase.script === 'function' ? phase.script() : [];
    if(!events || !events.length) { toast('⚠️ execPhase: no events for phase '+idx); return; }

    // Show phase is active
    const stEl=$('pst-'+idx);
    if(stEl) { stEl.textContent='执行中'; stEl.style.background='#eef0ff'; stEl.style.color='#4f46e5'; }

    // Open body
    const bEl=$('pbd-'+idx); if(bEl) bEl.classList.add('open');
    const exEl=$('pex-'+idx); if(exEl) exEl.classList.add('open');

    for(let i=0; i<events.length; i++) {
      const ev = events[i];
      const delay = ev.delay || rand(500,1200);

      // Contextual typing label
      const labels = { think:'思考中', search:'搜索中', found:'获取结果', retry:'重试中', fail:'处理异常', decide:'决策中', done:'确认', wait:'等待', info:'分析中', ref:'查阅资料', skip:'跳过', skill:'匹配skill', write:'写入中' };
      showTyp(true, labels[ev.icon]||'处理中', (i+1)+'/'+events.length);

      // Add think class for enhanced wave animation
      if(ev.icon==='think') dom.typing.querySelector('.typing-a').classList.add('think');
      else dom.typing.querySelector('.typing-a').classList.remove('think');

      // Fire tool-call notification
      let notifEl = null;
      try { notifEl = notify(ev.icon, (ev.text||'').replace(/<[^>]*>/g,'').trim()); }catch(e){}

      // Wait before showing the event — cycle thinking stages during wait
      const stages = THINK_STAGES[ev.icon];
      if(stages && stages.length > 1) {
        const stageDur = delay / stages.length;
        for(let s=0; s<stages.length; s++) {
          const lb=$('typingLabel'); if(lb) lb.textContent = labels[ev.icon]||'处理中';
          const st=$('typingStep');
          if(st) st.textContent = stages[s];
          await sleep(stageDur);
        }
      } else {
        await sleep(delay);
      }

      showTyp(false);

      // Render event with staggered entrance (pre-reserve space for sub-text)
      const div = document.createElement('div'); div.className='ev';
      div.innerHTML = `<div class="ev-icon">${evIcon(ev.icon)}</div><div class="ev-body"><div class="ev-t">${ev.text||''}</div>${ev.sub ? `<div class="ev-sub" style="margin-left:28px;display:none">${ev.sub}</div>` : ''}</div>`;
      container.appendChild(div);
      // Dismiss notification when event appears
      if(notifEl) closeNotif(notifEl);
      sb();

      // Show sub-text after a moment if present
      if(ev.sub) {
        const subDelay = ev.subAfter || rand(500,800);
        await sleep(subDelay);
        const subEl = div.querySelector('.ev-sub');
        if(subEl) { subEl.style.display = 'block'; requestAnimationFrame(() => subEl.style.opacity = '1'); sb(); }
      }

      // Show generated content block if present
      if(ev.content) {
        const contentDelay = ev.contentAfter || 600;
        await sleep(contentDelay);
        const cb = renderContent(ev.content.type, ev.content.data, ev.content.title);
        container.appendChild(cb);
        sb();
      }

      // Interaction: confirm or decision
      if(ev.type === 'confirm') {
        showTyp(false);
        await waitConfirm(container, ev.btnText);
        sb();
      } else if(ev.type === 'decision') {
        showTyp(false);
        const choice = await waitDecision(container, ev.question, ev.options);
        sb();
      } else if(ev.type === 'mcp') {
        showTyp(false);
        await mcpCall(container, ev.tool, ev.args, ev.label);
      }
    }

    // Phase done
    if(stEl) { stEl.textContent='✓ 完成'; stEl.className='ps done'; }

    // Show assets with MCP write simulation per file
    const aEl=$('assets-'+idx);
    if(aEl) {
      aEl.classList.add('show');
      const list=$('al-'+idx);
      if(list) {
        // Show references if any
        if(phase.refs && phase.refs.length) {
          const refDiv=document.createElement('div'); refDiv.className='refs';
          refDiv.innerHTML=`<div class="refs-title">📎 参考文档</div><div class="refs-list">${phase.refs.map(r=>`<span class="ref-item">📄 ${r}</span>`).join('')}</div>`;
          aEl.insertBefore(refDiv, list);
        }

        // Track current phase for mcpWrite
        S.currentPhaseIdx = idx;

        // Show agent "writing" via MCP for each asset
        showTyp(true, '写入中', 'MCP.write');
        dom.typing.querySelector('.typing-a').classList.remove('think');

        for(const a of (phase.assets||[])) {
          await mcpWrite(a.icon, a.n, a.ext);
        }

        showTyp(false);
        renderAssets(idx, phase.assets);
      }
    }
  } catch(e) {
    toast('⚠️ Phase '+idx+' 执行异常: '+e.message);
    console.error('execPhase error', idx, e);
  }
}

// ===== Main process =====
async function startProcess(text) {
  S.running=true;
  dom.sendBtn.disabled=true;
  if(dom.sendBtn2) dom.sendBtn2.disabled=true;

  // HVC detection and conversation management
  if(text.toLowerCase().includes('hvc') || text.toLowerCase().includes('高价值客户')) {
    const hasDetail = text.includes('HKT') || text.includes('vip') || text.includes('vvip') || text.includes('场馆') || text.includes('演唱会') || text.includes('保障');
    if(!hasDetail && S.conversation !== 'has_detail') {
      S.conversation = 'awaiting_detail';
      dom.welcome.classList.add('shrink');
      dom.ws.classList.add('show');
      dom.wsBottom.style.display='block';
      dom.chips.style.display='none';
      addMsg('user', text);
      await sleep(500);
      showTyp(true);
      await sleep(1200);
      showTyp(false);
      addMsg('agent', `<div class="msg-meta"><span class="dot"></span> SA · ${ts()}</div>
        <div class="p-card" style="border-top:2px solid var(--amber);padding:12px 16px;font-size:14px;line-height:1.6">
🤔 您输入的信息有点少，我不是很清楚您具体想要的是一个什么业务方面的 Agent 应用。<br><br>
比如：<br>
• 是哪个运营商/企业？（如 HKT）<br>
• 要保障什么场景？（如体育场馆、演唱会）<br>
• 保障哪类用户？（如 VIP、VVIP）<br><br>
<span class="hl">请详细描述您的业务场景，我来帮您分析。</span></div>`);
      sb();
      dom.wsStatus.innerHTML=`<span class="d" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></span> WAITING · 等待补充信息`;
      dom.statusOrigColor = '#d97706';
      S.running=false;
      dom.sendBtn.disabled=false;
      if(dom.sendBtn2) dom.sendBtn2.disabled=false;
      dom.input2.placeholder='请详细描述您的业务场景...';
      return;
    }
    // Has detail or was prompted — run HVC flow
    S.conversation = 'has_detail';
    S.skill = 'jic-telecom';
    S.type = 'hvc';

    dom.welcome.classList.add('shrink');
    dom.ws.classList.add('show');
    dom.wsBottom.style.display='block';
    dom.chips.style.display='none';
    addMsg('user', text);
    await sleep(500);
    showTyp(true);
    await sleep(900);
    showTyp(false);
    addMsg('agent', `<div class="msg-meta"><span class="dot"></span> SA · ${ts()}</div>
      <div class="p-card" style="border-top:2px solid var(--accent);padding:12px 16px;font-size:14px;line-height:1.6">
📥 收到 HKT 高价值客户保障需求，正在分析...<br>
       Skill：<strong>jic-telecom · HVC Agent</strong></div>`);

    dom.wsStatus.innerHTML=`<span class="d"></span> PROCESSING · <span class="v" id="phIdx">0</span>/<span id="phTot">${PHASES_HVC.length}</span> · ⏱ <span class="v" id="timer">00:00</span>`;
    startTimer();
    S.phases = PHASES_HVC;
    S.phaseTotal = PHASES_HVC.length;

    for(let i=0; i<PHASES_HVC.length; i++) {
      try {
        const phEl=$('phTot'); if(phEl) phEl.textContent = PHASES_HVC.length;
        const ph=$('phIdx'); if(ph) ph.textContent=i+1;
        dom.wsBody.insertAdjacentHTML('beforeend', phaseCardHTML(PHASES_HVC[i], i));
        sbToPhase(i);
        await sleep(300);
        await execPhase(i);
        if(i < PHASES_HVC.length-1) { flowArrow(); sb(); }
        await sleep(200);
      } catch(e) {
        toast('⚠️ Phase loop error: '+e.message);
        console.error('startProcess loop error', i, e);
      }
    }

    stopTimer();
    const elapsed=$('timer')?$('timer').textContent:'00:00';
    dom.wsStatus.innerHTML=`<span class="d" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> COMPLETED · ${PHASES_HVC.length}阶段 · ⏱ ${elapsed}`;
    dom.wsStatus.style.color='#059669';

    addMsg('agent', `<div class="msg-meta"><span class="dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> SA · ${ts()}</div>
      <div class="final-summary">
        <div class="fs-title">🎉 HVC Agent 全部完成 — 交付汇总</div>
        <div class="fs-grid">
          <div class="fs-item"><div class="num">${PHASES_HVC.length}</div><div class="label">阶段</div></div>
          <div class="fs-item"><div class="num">${elapsed}</div><div class="label">总耗时</div></div>
          <div class="fs-item"><div class="num">6</div><div class="label">设备类型</div></div>
          <div class="fs-item"><div class="num">12+</div><div class="label">策略模板</div></div>
        </div>
        <div class="fs-dl">
          <div class="dl-btn" onclick="toast('📁 正在打包全部源码...');setTimeout(()=>toast('✅ 已导出'),1200)">📁 下载全部资产</div>
          <div class="dl-btn" onclick="toast('📄 正在导出运维手册...');setTimeout(()=>toast('✅ 已导出'),1200)">📄 下载运维手册</div>
        </div>
      </div>`);
    sb();

    S.running=false;
    dom.sendBtn.disabled=false;
    if(dom.sendBtn2) dom.sendBtn2.disabled=false;
    dom.input2.placeholder='输入新需求继续...';
    return;
  }

  // Detect type
  S.type = 'new';
  if(text.includes('新增')||text.includes('追加')) S.type='append';
  else if(text.includes('二次开发')||text.includes('现有')||text.includes('基础')) S.type='rework';

  // Detect skill
  S.skill = 'jic-app-dev';
  if(text.includes('HTML')||text.includes('原型')||text.includes('设计')) S.skill='jic-huashu-design';

  // Transition view
  dom.welcome.classList.add('shrink');
  dom.ws.classList.add('show');
  dom.wsBottom.style.display='block';
  dom.chips.style.display='none';

  // User msg
  addMsg('user', text);
  await sleep(500);

  // Agent intro
  showTyp(true);
  await sleep(900);
  showTyp(false);

  addMsg('agent', `<div class="msg-meta"><span class="dot"></span> SA · ${ts()}</div>
    <div class="p-card" style="border-top:2px solid var(--accent);padding:12px 16px;font-size:14px;line-height:1.6">
📥 收到需求，正在分析...<br>
       类型：<strong>${S.type==='new'?'新业务构建':S.type==='append'?'功能追加':'二次开发'}</strong> · Skill</div></div>`);

  dom.wsStatus.innerHTML=`<span class="d"></span> PROCESSING · <span class="v" id="phIdx">0</span>/<span id="phTot">${PHASES.length}</span> · ⏱ <span class="v" id="timer">00:00</span>`;
  startTimer();

  // Set phases
  S.phases = PHASES;
  S.phaseTotal = PHASES.length;

  // Render and exec phases
  for(let i=0; i<PHASES.length; i++) {
    try {
      const phEl=$('phTot'); if(phEl) phEl.textContent = PHASES.length;
      const ph=$('phIdx'); if(ph) ph.textContent=i+1;

      // Render phase card
      dom.wsBody.insertAdjacentHTML('beforeend', phaseCardHTML(PHASES[i], i));
      sbToPhase(i);
      await sleep(300);

      // Execute phase events
      await execPhase(i);

      // Arrow between phases
      if(i < PHASES.length-1) { flowArrow(); sb(); }

      await sleep(200);
    } catch(e) {
      toast('⚠️ Phase loop error: '+e.message);
      console.error('startProcess loop error', i, e);
    }
  }

  stopTimer();
  const elapsed=$('timer')?$('timer').textContent:'00:00';

  dom.wsStatus.innerHTML=`<span class="d" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> COMPLETED · ${PHASES.length}阶段 · ⏱ ${elapsed}`;
  dom.wsStatus.style.color='#059669';

  // Final summary
  addMsg('agent', `<div class="msg-meta"><span class="dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> SA · ${ts()}</div>
    <div class="final-summary">
      <div class="fs-title">🎉 全部完成 — 交付汇总</div>
      <div class="fs-grid">
        <div class="fs-item"><div class="num">${PHASES.length}</div><div class="label">阶段</div></div>
        <div class="fs-item"><div class="num">${elapsed}</div><div class="label">总耗时</div></div>
        <div class="fs-item"><div class="num">10+</div><div class="label">参考资料</div></div>
      </div>
      <div class="fs-dl">
        <div class="dl-btn" onclick="toast('📁 正在打包全部源码...');setTimeout(()=>toast('✅ 已导出'),1200)">📁 下载全部源码</div>
        <div class="dl-btn" onclick="toast('📄 正在生成全部文档...');setTimeout(()=>toast('✅ 已导出'),1200)">📄 下载全部文档</div>
      </div>
    </div>`);
  sb();

  S.running=false;
  dom.sendBtn.disabled=false;
  if(dom.sendBtn2) dom.sendBtn2.disabled=false;
  dom.input2.placeholder='输入新需求继续...';
}

async function send() {
  const text=dom.input.value.trim();
  if(!text||S.running) return;
  await startProcess(text);
}

async function send2() {
  const text=dom.input2.value.trim();
  if(!text||S.running) return;
  dom.input2.value='';
  await startProcess(text);
}

function toggleP(idx) {
  const bd=$('pbd-'+idx), ex=$('pex-'+idx);
  if(!bd) return;
  bd.classList.toggle('open'); ex.classList.toggle('open');
}

// Events
dom.input.addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
dom.input.addEventListener('input', function(){this.style.height='auto';var m=130;var sh=this.scrollHeight;this.style.height=Math.min(sh,m)+'px';this.style.overflowY=sh>m?'auto':'hidden'});
dom.input2.addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send2()}});
dom.input2.addEventListener('input', function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'});

// Scroll lock: always at bottom
dom.wsBody.addEventListener('scroll', function() {
  if(this.scrollTop + this.clientHeight < this.scrollHeight - 8) {
    this.scrollTop = this.scrollHeight - this.clientHeight;
  }
});

window.send=send; window.send2=send2; window.toggleP=toggleP; window.setV=setV; window.toast=toast;
</script>
