<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA SMART DESKTOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-alt:#edf0f5;
  --border:#e2e5ea;--border-light:#eef1f5;
  --text:#1a1a2e;--text-secondary:#5d5d7a;--text-muted:#9090aa;
  --accent:#4f46e5;--accent-light:#818cf8;--accent-bg:#edf0ff;
  --green:#10b981;--green-bg:#ecfdf7;
  --amber:#f59e0b;--amber-bg:#fff8eb;
  --pink:#ec4899;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro','Microsoft YaHei',system-ui,sans-serif;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 24px;transition:all .6s
}
.welcome.shrink{min-height:0;padding:0;position:sticky;top:0;z-index:20}
.welcome-inner{text-align:center;max-width:640px;width:100%;transition:all .6s}
.welcome.shrink .welcome-inner{display:none}
.welcome h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-bottom:4px;background:linear-gradient(135deg,#1a1a2e,#4f46e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{font-size:14px;color:var(--text-muted);margin-bottom:24px;line-height:1.5}
.input-box{
  background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:6px;display:flex;align-items:center;gap:10px;width:100%;
  box-shadow:var(--shadow);transition:all .3s
}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.input-box textarea{
  flex:1;border:none;outline:none;background:transparent;padding:18px 20px;
  font-size:15px;font-family:var(--font);color:var(--text);resize:none;
  min-height:28px;max-height:140px;line-height:1.55
}
.input-box textarea::placeholder{color:var(--text-muted)}
.input-box button{
  width:48px;height:48px;border:none;border-radius:14px;flex-shrink:0;margin-right:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:#fff;font-size:21px;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;justify-content:center
}
.input-box button:hover{transform:scale(1.05);box-shadow:0 0 28px rgba(79,70,229,.35)}
.input-box button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 16px;background:var(--surface);border:1px solid var(--border);border-radius:100px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.chip:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* Welcome footer — model & version */
.welcome-footer{
  margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap
}
.wf-item{
  display:flex;align-items:center;gap:6px;padding:5px 14px;
  background:var(--surface);border:1px solid var(--border-light);border-radius:100px;
  font-size:12px;font-family:var(--mono);color:var(--text-secondary)
}
.wf-item .wf-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.wf-item .wf-dot.green{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,.4)}
.wf-item .wf-dot.purple{background:var(--accent);box-shadow:0 0 6px rgba(79,70,229,.3)}
.wf-item .wf-label{font-weight:500}
.wf-item .wf-val{color:var(--text-muted)}

.workspace{display:none;flex-direction:column;height:100vh;max-width:860px;margin:0 auto;padding:0 24px}
.workspace.show{display:flex}
.ws-top{
  display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;flex-shrink:0
}
.ws-brand{display:flex;align-items:center;gap:8px}
.ws-brand .m{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.ws-brand .t{font-size:13px;font-weight:700;letter-spacing:.3px}
.ws-brand .st{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-left:4px}
.ws-status{font-size:11px;font-family:var(--mono);color:var(--text-muted);display:flex;align-items:center;gap:8px}
.ws-status .d{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

.ws-body{flex:1;overflow-y:auto;padding:4px 0 12px;min-height:0;scroll-behavior:smooth}
.ws-body::-webkit-scrollbar{width:4px}
.ws-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{animation:msg-in .5s cubic-bezier(.22,1,.36,1)}
@keyframes msg-in{from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)}}
.msg.user{
  float:right;clear:both;max-width:65%;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;
  padding:10px 16px;border-radius:18px 18px 4px 18px;font-size:14px;line-height:1.55;
  box-shadow:0 2px 12px rgba(79,70,229,.12);margin-bottom:10px
}
.msg.agent{clear:both;margin-bottom:10px}
.msg-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding-left:2px;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
.msg-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* Phase card */
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:pc-in .55s cubic-bezier(.22,1,.36,1)}
@keyframes pc-in{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.p-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border-light);user-select:none}
.p-hd .pi{font-size:16px}
.p-hd .pt{font-size:13px;font-weight:600;flex:1}
.p-hd .ps{
  font-size:10px;font-family:var(--mono);padding:2px 10px;border-radius:100px;
  background:var(--accent-bg);color:var(--accent);transition:all .3s
}
.p-hd .ps.done{background:var(--green-bg);color:var(--green)}
.p-hd .skill-badge{font-size:9px;padding:1px 8px;border-radius:100px;background:#f3e8ff;color:#7c3aed;font-family:var(--mono);font-weight:600;letter-spacing:.2px;margin-right:4px;white-space:nowrap}
.p-hd .pe{font-size:9px;color:var(--text-muted);transition:transform .3s}
.p-hd .pe.open{transform:rotate(180deg)}
.p-body{max-height:0;overflow:hidden;transition:max-height .45s,opacity .25s;opacity:0}
.p-body.open{max-height:4000px;opacity:1}

/* Events inside phase */
.events{padding:10px 16px 6px;display:flex;flex-direction:column;gap:3px}
.ev{
  display:flex;gap:10px;padding:6px 10px 6px 12px;border-radius:var(--radius-sm);
  position:relative;overflow:hidden;
  animation:ev-in .5s cubic-bezier(.22,1,.36,1)
}
.ev::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;width:2.5px;
  background:var(--accent);border-radius:2px;
  animation:ev-line .45s cubic-bezier(.22,1,.36,1)
}
@keyframes ev-in{
  0%{opacity:0;transform:translateY(14px);background:var(--accent-bg)}
  45%{background:var(--accent-bg)}
  100%{opacity:1;transform:translateY(0);background:transparent}
}
@keyframes ev-line{
  from{height:0;opacity:0} to{height:calc(100% - 12px);opacity:1}
}
.ev-icon{
  flex-shrink:0;width:20px;text-align:center;font-size:14px;margin-top:1px;
  animation:ev-icon .45s cubic-bezier(.34,1.56,.64,1)
}
@keyframes ev-icon{
  0%{transform:scale(0);opacity:0}
  60%{transform:scale(1.3);opacity:1}
  100%{transform:scale(1);opacity:1}
}
.ev-body{flex:1;min-width:0}
.ev-t{font-size:13px;line-height:1.55}
.ev-t .hl{color:var(--accent);font-weight:500}
.ev-t .dim{color:var(--text-muted)}
.ev-t .warn{color:var(--amber)}
.ev-t .err{color:#dc2626}
.ev-t .ok{color:var(--green)}
.ev-sub{
  font-size:11.5px;color:var(--text-secondary);margin-top:2px;line-height:1.5;
  padding:4px 0 2px
}
.ev-sub .tag{
  display:inline-block;font-size:10px;padding:1px 7px;border-radius:100px;
  background:var(--surface-alt);color:var(--text-muted);font-family:var(--mono);margin-right:4px
}
.ev-sub .tag.warn{background:var(--amber-bg);color:#d97706}
.ev-sub .tag.ok{background:var(--green-bg);color:var(--green)}
.ev-sub{animation:es-in .35s cubic-bezier(.22,1,.36,1)}
@keyframes es-in{from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:translateY(0)}}

/* Assets */
.assets{
  padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px;
  max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s,padding .4s;
  border-top:1px solid transparent
}
.assets.show{max-height:600px;opacity:1;padding:10px 16px 14px;border-top-color:var(--border-light)}
.assets-title{font-size:11px;font-weight:600;color:var(--text-muted);font-family:var(--mono);letter-spacing:.5px;margin-bottom:2px}
.assets-list{display:flex;flex-wrap:wrap;gap:10px}
.asset{
  display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-alt);
  border-radius:var(--radius);border:1px solid var(--border);font-size:14px;
  cursor:pointer;transition:all .2s;min-width:180px
}
.asset .ai{font-size:24px}
.asset .an{font-weight:600;font-size:13px}
.asset .as{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.asset:hover{background:var(--accent-bg);border-color:var(--accent)}
.asset .ai{font-size:15px}
.asset .an{font-weight:500}
.asset .as{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-left:2px}
.asset .dl{font-size:15px;color:var(--accent);font-family:var(--mono);margin-left:auto;opacity:0;transition:opacity .2s}
.asset:hover .dl{opacity:1}
.asset .ext{
  font-size:10px;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-weight:600;
  text-transform:uppercase
}
.asset .ext.pdf{background:#fee2e2;color:#dc2626}
.asset .ext.docx{background:#dbeafe;color:#2563eb}
.asset .ext.xlsx{background:#dcfce7;color:#16a34a}
.asset .ext.zip{background:#fef3c7;color:#d97706}
.asset .ext.html{background:#f3e8ff;color:#7c3aed}
.asset .ext.png{background:#fce7f3;color:#db2777}

.fa{text-align:center;padding:10px 0 6px;color:var(--text-muted);font-size:10px;font-family:var(--mono);letter-spacing:2px;clear:both;animation:fa-in .4s cubic-bezier(.22,1,.36,1)}
@keyframes fa-in{from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)}}

/* Phase status transition */
.ps{transition:all .45s cubic-bezier(.22,1,.36,1)!important}
.ps.done{animation:ps-done .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes ps-done{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

/* Asset panel entrance */
.assets.show{animation:as-in .5s cubic-bezier(.22,1,.36,1)}
@keyframes as-in{from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)}}

/* File generation spinner */
.gen-spinner{
  display:flex;align-items:center;gap:10px;padding:6px 0 4px;animation:gs-in .3s ease-out
}
@keyframes gs-in{from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)}}
.gs-ring{
  width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:gs-spin .7s linear infinite
}
@keyframes gs-spin{to{transform:rotate(360deg)}}
.gs-text{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.gs-done{animation:gs-out .35s ease-out forwards}
@keyframes gs-out{to{opacity:0;transform:translateY(-4px);max-height:0;padding:0;margin:0;overflow:hidden}}

.typing-el{max-width:860px;margin:0 auto;padding:0 24px}
.typing-r{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  animation:ti-in .25s ease-out
}
@keyframes ti-in{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)}}
.typing-a{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;font-weight:700;letter-spacing:0;
  animation:ta-pulse 2s ease-in-out infinite
}
@keyframes ta-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.35)}
  50%{box-shadow:0 0 0 8px rgba(79,70,229,0)}
}
.typing-l{font-size:11px;font-family:var(--mono);color:var(--text-muted);display:flex;align-items:center;gap:8px}
.typing-d{display:inline-flex;gap:4px}
.typing-d span{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  animation:td 1.5s infinite both
}
.typing-d span:nth-child(1){animation-delay:0s}
.typing-d span:nth-child(2){animation-delay:.2s}
.typing-d span:nth-child(3){animation-delay:.4s}
.typing-d span:nth-child(4){animation-delay:.6s}
@keyframes td{
  0%,80%,100%{transform:scale(.55);opacity:.3}
  40%{transform:scale(1);opacity:1}
}
.typing-label{
  display:inline-block;font-size:10px;color:var(--text-muted);
  background:var(--surface-alt);padding:1px 8px;border-radius:4px;
  font-family:var(--mono);letter-spacing:.3px;animation:tl-in .3s ease-out
}
@keyframes tl-in{from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)}}

.ws-bottom{flex-shrink:0;padding:10px 0 16px;border-top:1px solid var(--border-light)}
.ws-input{
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:3px;display:flex;align-items:center;gap:6px;transition:all .3s
}
.ws-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.ws-input textarea{
  flex:1;border:none;outline:none;background:transparent;padding:10px 14px;
  font-size:13.5px;font-family:var(--font);color:var(--text);resize:none;
  min-height:22px;max-height:80px;line-height:1.5
}
.ws-input textarea::placeholder{color:var(--text-muted)}
.ws-input button{
  width:38px;height:38px;border:none;border-radius:10px;flex-shrink:0;margin-right:2px;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;
  font-size:17px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center
}
.ws-input button:hover{transform:scale(1.05);box-shadow:0 0 18px rgba(79,70,229,.25)}
.ws-input button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.toast-global{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;font-size:12px;padding:8px 18px;border-radius:8px;
  opacity:0;transition:opacity .3s;z-index:100;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15)
}
.toast-global.show{opacity:1}

/* Tool-call notification panel (slides in from right like email) */
.notif-stack{
  position:fixed;right:16px;top:12px;z-index:55;
  display:flex;flex-direction:column;gap:5px;
  pointer-events:none;max-width:310px;width:310px
}
.notif{
  background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius-sm);box-shadow:0 6px 24px rgba(0,0,0,.1);
  padding:9px 28px 9px 12px;display:flex;gap:8px;align-items:flex-start;
  position:relative;
  animation:notif-in .45s cubic-bezier(.22,1,.36,1);
  pointer-events:auto;cursor:default
}
.notif.out{animation:notif-out .3s ease-in forwards}
@keyframes notif-in{from{opacity:0;transform:translateX(70px)} to{opacity:1;transform:translateX(0)}}
@keyframes notif-out{from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(70px)}}
.notif-icon{
  flex-shrink:0;width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;margin-top:1px;background:var(--accent-bg)
}
.notif-body{flex:1;min-width:0}
.notif-header{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px
}
.notif-tool{
  font-size:10px;font-family:var(--mono);font-weight:600;
  color:var(--accent);letter-spacing:.2px;white-space:nowrap
}
.notif-time{
  font-size:9px;font-family:var(--mono);color:var(--text-muted);white-space:nowrap
}
.notif-text{
  font-size:12px;color:var(--text);line-height:1.45;margin-top:1px
}
.notif-text.clamp1{-webkit-line-clamp:1;-webkit-box-orient:vertical;display:-webkit-box;overflow:hidden}
.notif-text.clamp2{-webkit-line-clamp:2;-webkit-box-orient:vertical;display:-webkit-box;overflow:hidden}
.notif-text.full{display:block}

/* Category badge */
.notif-badge{
  display:inline-block;font-size:8.5px;padding:1px 6px;border-radius:3px;
  font-family:var(--mono);margin-top:3px;letter-spacing:.2px
}
.notif-badge.skill{background:#f3e8ff;color:#7c3aed}
.notif-badge.doc{background:#dbeafe;color:#2563eb}
.notif-badge.code{background:#dcfce7;color:#16a34a}
.notif-badge.report{background:#fef3c7;color:#d97706}
.notif-badge.system{background:#fce7f3;color:#db2777}
.notif-badge.tool{background:#eef2ff;color:#4f46e5}
.notif-badge.think{background:#ede9fe;color:#7c3aed}

/* Close button */
.notif-close{
  position:absolute;top:5px;right:5px;width:17px;height:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-muted);cursor:pointer;
  border-radius:4px;transition:all .15s;opacity:0;line-height:1;
  font-family:var(--font)
}
.notif:hover .notif-close{opacity:.6}
.notif-close:hover{background:var(--surface-alt);color:var(--text);opacity:1!important}

/* Card border colors per category */
.notif.cat-tool{border-left-color:#4f46e5}
.notif.cat-skill{border-left-color:#7c3aed}
.notif.cat-doc{border-left-color:#2563eb}
.notif.cat-code{border-left-color:#16a34a}
.notif.cat-report{border-left-color:#d97706}
.notif.cat-system{border-left-color:#db2777}
.notif.cat-think{border-left-color:#818cf8}

.final-summary{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);clear:both;margin-top:4px
}
.final-summary .fs-title{font-size:13px;font-weight:600;margin-bottom:10px}
.final-summary .fs-grid{display:flex;flex-wrap:wrap;gap:8px}
.final-summary .fs-item{flex:1;min-width:90px;padding:10px;background:var(--surface-alt);border-radius:var(--radius-sm);text-align:center;border:1px solid var(--border)}
.final-summary .fs-item .num{font-size:22px;font-weight:700;color:var(--accent)}
.final-summary .fs-item .label{font-size:11px;color:var(--text-muted);margin-top:2px}
.final-summary .fs-dl{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.final-summary .fs-dl .dl-btn{
  padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all .2s
}
.final-summary .fs-dl .dl-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="toast-global" id="toast"></div>
<div class="notif-stack" id="notifStack"></div>

<!-- Welcome -->
<div class="welcome" id="welcome">
  <div class="welcome-inner">
    <h1>SA SMART DESKTOP</h1>
    <p>描述你的需求，Agent将分析、规划、执行并交付完整资产</p>
    <div class="input-box">
      <textarea id="input" placeholder="例如：帮我构建一个电商订单管理的配置管理系统..." rows="1"></textarea>
      <button id="sendBtn" onclick="send()">↵</button>
    </div>
    <div class="chips" id="chips">

function notify(icon, text) {
  const stack = $('notifStack');

  const action = pick(NOTIF_ACTIONS[icon]||[{label:'Agent.run', cat:'工具'}]);
  const time = new Date().toTimeString().slice(0,8);
  const catClass = CAT_CLASS[action.cat]||'tool';
  const showBadge = Math.random() > 0.4;  // ~60% get a badge

  // Vary text clamp: 40% clamp1, 35% clamp2, 25% full
  const clampClass = Math.random() < 0.4 ? 'clamp1' : (Math.random() < 0.54 ? 'clamp2' : 'full');

  const el = document.createElement('div');
  el.className = 'notif cat-'+catClass;
  el.innerHTML = `<div class="notif-close" onclick="dismissNotif(this)">✕</div>
    <div class="notif-icon">${NOTIF_ICONS[icon]||'⚡'}</div>

      ${showBadge ? `<div class="notif-badge ${BADGE_CLASS[action.cat]||'tool'}">${action.cat}</div>` : ''}
    </div>`;
  stack.appendChild(el);

  // Auto-remove after 5s with slide-out
  setTimeout(() => {
    if(el.parentNode) { el.classList.add('out'); setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 300); }
  }, 5000);

  // Cap at 6 visible — remove oldest immediately
  while(stack.children.length > 6) {
    const first = stack.children[0];
    if(first && first.parentNode) first.parentNode.removeChild(first);
  }
}

      document.body.appendChild(l); l.click(); document.body.removeChild(l); URL.revokeObjectURL(u);

async function execPhase(idx) {
  try {
    const phase = S.phases ? S.phases[idx] : null;
    if(!phase) { toast('⚠️ execPhase: phase '+idx+' not found'); return; }

    const container = $('evts-'+idx);
    if(!container) { toast('⚠️ execPhase: container evts-'+idx+' not found'); return; }

    const events = typeof phase.script === 'function' ? phase.script() : [];
    if(!events || !events.length) { toast('⚠️ execPhase: no events for phase '+idx); return; }

    // Show phase is active
    const stEl=$('pst-'+idx);
    if(stEl) { stEl.textContent='执行中'; stEl.style.background='#eef0ff'; stEl.style.color='#4f46e5'; }

    // Open body
    const bEl=$('pbd-'+idx); if(bEl) bEl.classList.add('open');
    const exEl=$('pex-'+idx); if(exEl) exEl.classList.add('open');

    for(let i=0; i<events.length; i++) {
      const ev = events[i];
      const delay = ev.delay || rand(500,1200);

      // Contextual typing label
      const labels = { think:'思考中', search:'搜索中', found:'获取结果', retry:'重试中', fail:'处理异常', decide:'决策中', done:'确认', wait:'等待', info:'分析中', ref:'查阅资料', skip:'跳过', skill:'匹配skill' };
      showTyp(true, labels[ev.icon]||'处理中', (i+1)+'/'+events.length);

      // Fire tool-call notification
      try { notify(ev.icon, (ev.text||'').replace(/<[^>]*>/g,'').trim()); }catch(e){}

      // Wait before showing the event
      await sleep(delay);

      showTyp(false);

      // Render event with staggered entrance
      const div = document.createElement('div'); div.className='ev';
      div.innerHTML = `<div class="ev-icon">${evIcon(ev.icon)}</div><div class="ev-body"><div class="ev-t">${ev.text||''}</div></div>`;
      container.appendChild(div);
      sbToPhase(idx);

      // Show sub-text after a moment if present
      if(ev.sub) {
        const subDelay = ev.subAfter || rand(500,800);
        await sleep(subDelay);
        const subDiv = document.createElement('div');
        subDiv.className = 'ev-sub'; subDiv.style.marginLeft = '28px';
        subDiv.innerHTML = ev.sub;
        container.appendChild(subDiv);
        sbToPhase(idx);
      }
    }

    // Phase done
    if(stEl) { stEl.textContent='✓ 完成'; stEl.className='ps done'; }

    // Show assets with file generation spinner
    const aEl=$('assets-'+idx);
    if(aEl) {
      aEl.classList.add('show');
      const list=$('al-'+idx);
      if(list) {
        // Show spinner
        const spinner=document.createElement('div'); spinner.className='gen-spinner';
        spinner.innerHTML=`<div class="gs-ring"></div><div class="gs-text">📄 文件生成中<span id="gsd-${idx}"></span></div>`;
        list.appendChild(spinner);

        // Animate dots via JS
        let dotCount=0;
        const dotEl=$('gsd-'+idx);
        const dotTimer=setInterval(()=>{dotCount=(dotCount+1)%4;if(dotEl)dotEl.textContent='.'.repeat(dotCount)},400);

        // Wait ~5s then show real assets
        const genTime=rand(4000,6000);
        await sleep(genTime);

        clearInterval(dotTimer);
        spinner.classList.add('gs-done');
        setTimeout(() => { if(spinner.parentNode) spinner.parentNode.removeChild(spinner); renderAssets(idx, phase.assets); }, 350);
      }
    }
  } catch(e) {
    toast('⚠️ Phase '+idx+' 执行异常: '+e.message);
    console.error('execPhase error', idx, e);
  }
}

// ===== Main process =====
async function startProcess(text) {
  S.running=true;
  dom.sendBtn.disabled=true;
  if(dom.sendBtn2) dom.sendBtn2.disabled=true;

  // Detect type
  S.type = 'new';
  if(text.includes('新增')||text.includes('追加')) S.type='append';
  else if(text.includes('二次开发')||text.includes('现有')||text.includes('基础')) S.type='rework';

  // Detect skill
  S.skill = 'app-dev';
  if(text.includes('HTML')||text.includes('原型')||text.includes('设计')) S.skill='huashu-design';

  // Transition view
  dom.welcome.classList.add('shrink');
  dom.ws.classList.add('show');
  dom.wsBottom.style.display='block';
  dom.chips.style.display='none';

  // User msg
  addMsg('user', text);
  await sleep(500);

  // Agent intro
  showTyp(true);
  await sleep(900);
  showTyp(false);

  addMsg('agent', `<div class="msg-meta"><span class="dot"></span> SA · ${ts()}</div>
    <div class="p-card" style="border-top:2px solid var(--accent);padding:12px 16px;font-size:14px;line-height:1.6">
📥 收到需求，正在分析...<br>
       类型：<strong>${S.type==='new'?'新业务构建':S.type==='append'?'功能追加':'二次开发'}</strong> · Skill</div></div>`);

  dom.wsStatus.innerHTML=`<span class="d"></span> PROCESSING · <span class="v" id="phIdx">0</span>/<span id="phTot">${PHASES.length}</span> · ⏱ <span class="v" id="timer">00:00</span>`;
  startTimer();

  // Set phases
  S.phases = PHASES;
  S.phaseTotal = PHASES.length;

  // Render and exec phases
  for(let i=0; i<PHASES.length; i++) {
    try {
      const phEl=$('phTot'); if(phEl) phEl.textContent = PHASES.length;
      const ph=$('phIdx'); if(ph) ph.textContent=i+1;

      // Render phase card
      dom.wsBody.insertAdjacentHTML('beforeend', phaseCardHTML(PHASES[i], i));
      sb();
      await sleep(300);

      // Execute phase events
      await execPhase(i);

      // Arrow between phases
      if(i < PHASES.length-1) { flowArrow(); sb(); }

      await sleep(200);
    } catch(e) {
      toast('⚠️ Phase loop error: '+e.message);
      console.error('startProcess loop error', i, e);
    }
  }

  stopTimer();
  const elapsed=$('timer')?$('timer').textContent:'00:00';

  dom.wsStatus.innerHTML=`<span class="d" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> COMPLETED · ${PHASES.length}阶段 · ⏱ ${elapsed}`;
  dom.wsStatus.style.color='#059669';

  // Final summary
  addMsg('agent', `<div class="msg-meta"><span class="dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></span> SA · ${ts()}</div>
    <div class="final-summary">
      <div class="fs-title">🎉 全部完成 — 交付汇总</div>
      <div class="fs-grid">
        <div class="fs-item"><div class="num">${PHASES.length}</div><div class="label">阶段</div></div>
        <div class="fs-item"><div class="num">${elapsed}</div><div class="label">总耗时</div></div>
        <div class="fs-item"><div class="num">10+</div><div class="label">参考资料</div></div>
      </div>
      <div class="fs-dl">
        <div class="dl-btn" onclick="toast('📁 正在打包全部源码...');setTimeout(()=>toast('✅ 已导出'),1200)">📁 下载全部源码</div>
        <div class="dl-btn" onclick="toast('📄 正在生成全部文档...');setTimeout(()=>toast('✅ 已导出'),1200)">📄 下载全部文档</div>
      </div>
    </div>`);
  sb();

  S.running=false;
  dom.sendBtn.disabled=false;
  if(dom.sendBtn2) dom.sendBtn2.disabled=false;
  dom.input2.placeholder='输入新需求继续...';
}

async function send() {
  const text=dom.input.value.trim();
  if(!text||S.running) return;
  await startProcess(text);
}

async function send2() {
  const text=dom.input2.value.trim();
  if(!text||S.running) return;
  dom.input2.value='';
  await startProcess(text);
}

function toggleP(idx) {
  const bd=$('pbd-'+idx), ex=$('pex-'+idx);
  if(!bd) return;
  bd.classList.toggle('open'); ex.classList.toggle('open');
}

// Events
dom.input.addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
dom.input.addEventListener('input', function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
dom.input2.addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send2()}});
dom.input2.addEventListener('input', function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'});

window.send=send; window.send2=send2; window.toggleP=toggleP; window.setV=setV; window.toast=toast;
</script>
